<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap');
body { margin: 0; padding: 20px; background: #333; display: flex; justify-content: center; }
.piagam-sheet {
    width: 210mm;
    height: 297mm;
    background: #fff;
    position: relative;
    box-sizing: border-box;
    overflow: hidden;
}
.portrait-frame {
    position: relative;
    width: 100%;
    height: 100%;
}
.portrait-bg-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
}
.portrait-top-header {
    position: absolute;
    top: 3.8%;
    left: 8.5%;
    right: 28%;
    z-index: 5;
}
.portrait-header-line {
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: #111827;
    line-height: 1.25;
    text-transform: uppercase;
}
.banner-text-overlay {
    position: absolute;
    top: 15.6%;
    left: 8.2%;
    z-index: 5;
    pointer-events: none;
}
.banner-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: 1.5px;
    color: #0A2540;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(255,255,255,0.4);
}
.banner-nomor {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 13.5px;
    letter-spacing: 0.8px;
    color: #0A2540;
    margin-top: 10px;
    text-transform: uppercase;
}
.banner-pasi-logo-box {
    position: absolute;
    top: 17.2%;
    left: 77.2%;
    width: 68px;
    height: 75px;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: perspective(200px) rotateY(-8deg);
}
.banner-pasi-logo-box img {
    max-width: 100%;
    max-height: 100%;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}
</style>
</head>
<body>
<div class='piagam-sheet'>
  <div class='portrait-frame'>
    <svg class='portrait-bg-svg' viewBox='0 0 584 848' preserveAspectRatio='none'>
      <defs>
        <!-- Rich Golden Yellow Gradient -->
        <linearGradient id='goldGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
          <stop offset='0%' stop-color='#EAA800'/>
          <stop offset='20%' stop-color='#F8C11A'/>
          <stop offset='50%' stop-color='#FDD835'/>
          <stop offset='80%' stop-color='#F5B300'/>
          <stop offset='100%' stop-color='#E69A00'/>
        </linearGradient>
        <!-- Pink Wedge Gradient -->
        <linearGradient id='pinkGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
          <stop offset='0%' stop-color='#E91E63'/>
          <stop offset='100%' stop-color='#C2185B'/>
        </linearGradient>
        <!-- 3D Cyan Prism Front -->
        <linearGradient id='cyanFront' x1='0%' y1='0%' x2='100%' y2='100%'>
          <stop offset='0%' stop-color='#38D4DE'/>
          <stop offset='100%' stop-color='#00ACC1'/>
        </linearGradient>
        <!-- 3D Cyan Prism Right Side Face -->
        <linearGradient id='cyanSide' x1='0%' y1='0%' x2='100%' y2='0%'>
          <stop offset='0%' stop-color='#0097A7'/>
          <stop offset='100%' stop-color='#00838F'/>
        </linearGradient>
        <!-- Cyan Floor Gradient -->
        <linearGradient id='cyanFloor' x1='0%' y1='0%' x2='100%' y2='100%'>
          <stop offset='0%' stop-color='#80DEEA'/>
          <stop offset='100%' stop-color='#4DD0E1'/>
        </linearGradient>
      </defs>

      <!-- 1. Top-Right Cyan Hanging Trapezoid -->
      <polygon points='400,0 447,0 447,85 400,60' fill='#4DD0E1'/>

      <!-- 2. Bottom-Right 3D Blue Pillar -->
      <polygon points='480,664 555,652 555,837 480,837' fill='#1565C0'/>

      <!-- 3. Bottom Cyan Perspective Floor -->
      <polygon points='185,789 480,762 555,754 555,837 185,837' fill='url(#cyanFloor)'/>

      <!-- 4. Bottom-Left 3D Pink Box -->
      <polygon points='27,765 97,751 185,789 97,795' fill='#F06292'/>
      <polygon points='27,765 97,795 97,837 27,837' fill='#E91E63'/>
      <polygon points='97,795 185,789 185,837 97,837' fill='#C2185B'/>

      <!-- 5. TOP BANNER ARTWORK (Matching Gambar 4 with precision) -->
      <!-- Pink Wedge extending left outside frame -->
      <polygon points='10,234 105,234 38,300 10,270' fill='url(#pinkGrad)'/>

      <!-- Yellow Gold Banner: Perfectly straight top line, angled bottom -->
      <polygon points='20,126 446,126 446,278 105,234 20,234' fill='url(#goldGrad)'/>

      <!-- 3D Cyan Prism Front Face (Where PASI Logo sits) -->
      <polygon points='446,126 532,126 532,246 446,278' fill='url(#cyanFront)'/>

      <!-- 3D Cyan Prism Right Perspective Face (Extends outside frame to right) -->
      <polygon points='532,126 565,138 565,228 532,246' fill='url(#cyanSide)'/>

      <!-- 6. Outer Black Perimeter Frame Line (Cuts through decorative shapes) -->
      <rect x='38' y='13' width='511' height='810' fill='none' stroke='#111827' stroke-width='2'/>
    </svg>

    <!-- Header Atas -->
    <div class='portrait-top-header'>
      <div class='portrait-header-line'>KEJUARAAN ATLETIK</div>
      <div class='portrait-header-line'>TINGKAT EKS KARESIDENAN PEKALONGAN</div>
      <div class='portrait-header-line'>TAHUN 2026</div>
    </div>

    <!-- Gold Banner Text Overlay -->
    <div class='banner-text-overlay'>
      <div class='banner-title'>PIAGAM<br>PENGHARGAAN</div>
      <div class='banner-nomor'>NOMOR : 001/EKS/PASI JATENG/VI/2026</div>
    </div>

    <!-- PASI Shield Logo in 3D Cyan Prism -->
    <div class='banner-pasi-logo-box'>
      <img src='public/assets/images/pasi-logo.png' alt='Logo PASI'>
    </div>
  </div>
</div>
</body>
</html>
